name: Analytical reproducibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m scripts.verify_archive
      - run: python -m scripts.reproduce --output results
      - run: python -m scripts.claim_experiments
      - run: python -m scripts.policy_demo
      - run: python -m scripts.reference_demo
      - run: python -m scripts.strengthen
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/publication_figures.cjs "$RUNNER_TEMP/quorum-figures"
      - run: diff -r results/figures "$RUNNER_TEMP/quorum-figures"
      - run: python -m pip install cairosvg==2.8.2
      - run: python -m scripts.export_publication_figures
      - uses: actions/upload-artifact@v4
        with:
          name: analytical-results
          path: results/
